name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          mkdir -p extracted_project
          unzip -o *.zip -d extracted_project
          # Check if project files are inside a nested folder
          if [ -f "extracted_project/build.gradle" ] || [ -f "extracted_project/build.gradle.kts" ]; then
            echo "PROJECT_DIR=extracted_project" >> $GITHUB_ENV
          else
            INNER_DIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            echo "PROJECT_DIR=$INNER_DIR" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAANWIN-PANEL-APK
          path: '${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk'
